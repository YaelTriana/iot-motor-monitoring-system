services:
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"

  simulator:
    build: .
    command: ["motormon-simulator"]
    environment:
      MQTT_HOST: mosquitto
      MOTORS: ${MOTORS:-3}
      INTERVAL: ${INTERVAL:-1}
      FAULT_PROBABILITY: ${FAULT_PROBABILITY:-0.002}
    depends_on: [mosquitto]
    restart: unless-stopped

  collector:
    build: .
    command: ["motormon-collector"]
    environment:
      MQTT_HOST: mosquitto
    ports:
      - "8000:8000"
    depends_on: [mosquitto]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    depends_on: [collector]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/motors.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]
