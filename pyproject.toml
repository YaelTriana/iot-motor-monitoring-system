[project]
name = "motormon"
version = "0.2.0"
description = "Industrial IoT motor vibration monitoring: MQTT simulator, collector and Prometheus metrics"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["paho-mqtt>=2.0,<3", "prometheus-client>=0.20"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
motormon-simulator = "motormon.simulator:main"
motormon-collector = "motormon.collector:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
